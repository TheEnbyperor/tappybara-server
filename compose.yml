services:
  redis:
    image: "redis:alpine"

  postgres:
    image: "postgres:latest"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data/

  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "http"
      - "http://nginx:80"
      - "--url=tappybara-admin.ngrok.app"
    env_file:
      - .env

  nginx:
    build: ./nginx
    expose:
      - 80
    volumes:
      - static:/static
    depends_on:
      - daphne

  daphne:
    build: .
    image: as207960/tappybara-server
    command: ["daphne", "tappybara.asgi:application", "-b", "::", "-p", "8000", "--access-log", "-", "--proxy-headers"]
    expose:
      - 8000
    volumes:
      - static:/app/static
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - STATIC_ROOT=/app/static
      - DJANGO_ALLOWED_HOSTS=tappybara-admin.ngrok.app
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://tappybara-admin.ngrok.app
      - DB_HOST=postgres
      - DB_USER=postgres
      - REDIS_SERVER=redis

  coaps:
    build: .
    network_mode: host
    command: ["python3", "/app/manage.py", "run-coaps-server"]
    volumes:
      - "./priv:/priv"
    environment:
      - COAPS_CERT_FILE=/priv/server-cert.der
      - COAPS_KEY_FILE=/priv/server-key.der
      - COAPS_SERVER_NAME=Tappybara
      - ZEROCONF_INTERFACES=eth1
    depends_on:
      - postgres
      - redis

volumes:
  db-data: {}
  static: {}